version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cok_postgres
    environment:
      POSTGRES_USER: cok_user
      POSTGRES_PASSWORD: cok_pass
      POSTGRES_DB: crown_of_kaliyug
    ports:
      - "5432:5432"
    volumes:
      - ./database/init_db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cok_redis
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    container_name: cok_chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: cok_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # If you have an NVIDIA GPU, uncomment the lines below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
